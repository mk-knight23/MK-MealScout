    <!--
      First-paint theme stamping (MK theme engine, V3). Reads
      mk.mealscout.theme.v1 / mk.mealscout.a11y.v1 and stamps data-theme,
      data-motion and data-transparency on <html> before CSS paints (no
      flash). Keep in sync with src/stores/settings.ts. CSP: this script is
      allowlisted by hash in vercel.json — editing it here requires
      recomputing the sha256 there (see docs note in vercel.json section
      of the PR/commit).
    -->
    <script>
      (function () {
        var html = document.documentElement;
        function prefers(query) {
          try { return window.matchMedia(query).matches; } catch (e) { return false; }
        }
        function read(key) {
          try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        var mode = read('mk.mealscout.theme.v1');
        if (mode !== 'light' && mode !== 'dark' && mode !== 'hc' && mode !== 'system') mode = 'light';
        var theme = mode === 'system' ? (prefers('(prefers-color-scheme: dark)') ? 'dark' : 'light') : mode;
        html.setAttribute('data-theme', theme);
        var a11y = null;
        try { a11y = JSON.parse(read('mk.mealscout.a11y.v1') || 'null'); } catch (e) { a11y = null; }
        var motion = (a11y && a11y.motion === 'reduced') || prefers('(prefers-reduced-motion: reduce)');
        var transparency = (a11y && a11y.transparency === 'reduced') || prefers('(prefers-reduced-transparency: reduce)');
        html.setAttribute('data-motion', motion ? 'reduced' : 'full');
        html.setAttribute('data-transparency', transparency ? 'reduced' : 'normal');
      })();
    </script>

    <!--
      Analytics activation: GTM/GA4 load only when VITE_GTM_ID / VITE_GA4_ID
      are set at build time. Vercel Web Analytics + Speed Insights are enabled
      from the Vercel dashboard and injected server-side. See docs/ANALYTICS.md.
    -->
    <script>
      (function(){
        var GTM_ID = "%VITE_GTM_ID%";
        if (GTM_ID && GTM_ID.charAt(0) !== '%' && /^GTM-[A-Z0-9]+$/.test(GTM_ID)) {
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({'gtm.start': Date.now(), event: 'gtm.js'});
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
          document.head.appendChild(s);
        }
        var GA4_ID = "%VITE_GA4_ID%";
        if (GA4_ID && GA4_ID.charAt(0) !== '%' && /^G-[A-Z0-9]+$/.test(GA4_ID)) {
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID;
          document.head.appendChild(g);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){ window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', GA4_ID, { anonymize_ip: true });
        }
      })();
    </script>
